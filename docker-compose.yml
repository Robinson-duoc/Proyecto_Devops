services:
  # ── BASE DE DATOS COMPARTIDA ──────────────────────────────
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app_net
  
  # ── BACKEND VENTAS ────────────────────────────────────────
  backend-ventas:
    build:
      context: ./back-Ventas_SpringBoot
      dockerfile: Dockerfile
    image: innovatech-backend-ventas:latest
    container_name: backend_ventas_app
    ports:
      - "3000:8080" # Expone el servicio en el puerto 3000 de tu computadora
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

  # ── BACKEND DESPACHOS ─────────────────────────────────────
  backend-despachos:
    build:
      # CORRECCIÓN: Cambiado de './back-Despachos_SpringBoot' al nombre real de tu repositorio
      context: ./Springboot-API-REST-DESPACHO
      dockerfile: Dockerfile
    image: innovatech-backend-despachos:latest
    container_name: backend_despachos_app
    ports:
      - "8080:8081" # Expone el servicio en el puerto 8080 de tu computadora
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

  # ── FRONTEND (Vite + React + Nginx) ────────────────────────
  frontend:
    build:
      context: ./front_despacho
      dockerfile: Dockerfile
    image: innovatech-frontend:latest
    container_name: frontend_app
    ports:
      - "80:80"
    environment:
      # CORRECCIÓN: El puerto externo mapeado para Despachos es el 8080, no el 8081.
      # NOTA: Al tener dos backends independientes, tu Frontend de React (Vite) 
      # debería manejar ambas URLs de endpoints si consulta a ambos módulos.
      VITE_API_DESPACHOS_URL: http://localhost:8080/api
      VITE_API_VENTAS_URL: http://localhost:3000/api
    depends_on:
      - backend-ventas
      - backend-despachos
    restart: unless-stopped
    networks:
      - app_net

# ── VOLÚMENES ─────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local

networks:
  app_net:
    driver: bridge