name: CI - Build y Push a ECR

on:
  push:
    branches:
      - main
      - develop

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: innovatech-spa

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a ECR
        id: login-ecr # Le damos un ID para capturar su salida (URL)
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push Frontend
        working-directory: frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.PROJECT_NAME }}-frontend:latest .
          docker push $ECR_REGISTRY/${{ env.PROJECT_NAME }}-frontend:latest

  build-backend-ventas:
    name: Build Backend Ventas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push Backend Ventas
        working-directory: back-Ventas_SpringBoot
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Aseguramos que el nombre termine en "-backend-ventas"
          docker build -t $ECR_REGISTRY/${{ env.PROJECT_NAME }}-backend-ventas:latest .
          docker push $ECR_REGISTRY/${{ env.PROJECT_NAME }}-backend-ventas:latest

  build-backend-despacho:
    name: Build Backend Despacho
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push Backend Despacho
        working-directory: back-Despachos_SpringBoot
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.PROJECT_NAME }}-backend-despacho:latest .
          docker push $ECR_REGISTRY/${{ env.PROJECT_NAME }}-backend-despacho:latest