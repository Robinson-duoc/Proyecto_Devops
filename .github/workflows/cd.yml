name: CI/CD - Frontend, Despachos y Ventas

on:
  push:
    branches:
      - main
    paths:
      - 'front_despacho/**'
      - 'Springboot-API-REST-DESPACHO/**' # ⚠️ REVISAR: Si está dentro de backend, pon 'backend/Springboot-API-REST-DESPACHO/**'
      - 'back-Ventas_SpringBoot/**'

env:
  AWS_REGION: us-east-1
  CLUSTER: innovatech-cluster

jobs:
  # ============================================================
  # JOB 1: Detectar qué servicios cambiaron (Bala de plata, no falla)
  # ============================================================
  detect-changes:
    name: Detectar cambios en servicios
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      despachos: ${{ steps.filter.outputs.despachos }}
      ventas: ${{ steps.filter.outputs.ventas }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Detectar cambios en carpetas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend: 'front_despacho/**'
            despachos: 'Springboot-API-REST-DESPACHO/**' # ⚠️ REVISAR: Misma ruta que el trigger de arriba
            ventas: 'back-Ventas_SpringBoot/**'

  # ============================================================
  # JOB 2: Build y Push Frontend
  # ============================================================
  build-frontend:
    name: Build y Push Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build imagen Frontend
        run: |
          docker build --platform linux/amd64 \
          -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-frontend:latest \
          -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-frontend:${{ github.sha }} \
          ./front_despacho

      - name: Push imagen Frontend a ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-frontend:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-frontend:${{ github.sha }}

  # ============================================================
  # JOB 3: Build y Push Despachos
  # ============================================================
  build-despachos:
    name: Build y Push Despachos
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.despachos == 'true'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build imagen Despachos
        run: |
          docker build --platform linux/amd64 \
          -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-backend-despachos:latest \
          -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-backend-despachos:${{ github.sha }} \
          ./Springboot-API-REST-DESPACHO # ⚠️ REVISAR: Si la carpeta está dentro de "backend", cambia esto por ./backend/Springboot-API-REST-DESPACHO o por tu ruta real

      - name: Push imagen Despachos a ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-backend-despachos:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-backend-despachos:${{ github.sha }}

  # ============================================================
  # JOB 4: Build y Push Ventas
  # ============================================================
  build-ventas:
    name: Build y Push Ventas
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ventas == 'true'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build imagen Ventas
        run: |
          docker build --platform linux/amd64 \
          -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-backend-ventas:latest \
          -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-backend-ventas:${{ github.sha }} \
          ./back-Ventas_SpringBoot # ⚠️ REVISAR: Asegúrate de que esta carpeta exista tal cual en la raíz de tu GitHub

      - name: Push imagen Ventas a ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-backend-ventas:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/innovatech-backend-ventas:${{ github.sha }}

  # ============================================================
  # JOB 5: Deploy Frontend a ECS
  # ============================================================
  deploy-frontend:
    name: Deploy Frontend a ECS
    runs-on: ubuntu-latest
    needs: build-frontend
    if: always() && needs.build-frontend.result == 'success'

    steps:
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Actualizar servicio Frontend en ECS
        run: |
          aws ecs update-service \
          --cluster ${{ env.CLUSTER }} \
          --service frontend-service \
          --force-new-deployment \
          --region ${{ env.AWS_REGION }}

  # ============================================================
  # JOB 6: Deploy Despachos a ECS
  # ============================================================
  deploy-despachos:
    name: Deploy Despachos a ECS
    runs-on: ubuntu-latest
    needs: build-despachos
    if: always() && needs.build-despachos.result == 'success'

    steps:
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Actualizar servicio Despachos en ECS
        run: |
          aws ecs update-service \
          --cluster ${{ env.CLUSTER }} \
          --service despachos-service \
          --force-new-deployment \
          --region ${{ env.AWS_REGION }}

  # ============================================================
  # JOB 7: Deploy Ventas a ECS
  # ============================================================
  deploy-ventas:
    name: Deploy Ventas a ECS
    runs-on: ubuntu-latest
    needs: build-ventas
    if: always() && needs.build-ventas.result == 'success'

    steps:
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Actualizar servicio Ventas en ECS
        run: |
          aws ecs update-service \
          --cluster ${{ env.CLUSTER }} \
          --service ventas-service \
          --force-new-deployment \
          --region ${{ env.AWS_REGION }}

  # ============================================================
  # JOB 8: Resumen final
  # ============================================================
  summary:
    name: Resumen de despliegue
    runs-on: ubuntu-latest
    needs: [detect-changes, build-frontend, build-despachos, build-ventas, deploy-frontend, deploy-despachos, deploy-ventas]
    if: always()
    steps:
      - name: Resumen de CI/CD
        run: |
          echo "=========================================="
          echo "Pipeline de CI/CD completado"
          echo "=========================================="
          echo "Cambios detectados:"
          echo "  Frontend:  ${{ needs.detect-changes.outputs.frontend }}"
          echo "  Despachos: ${{ needs.detect-changes.outputs.despachos }}"
          echo "  Ventas:    ${{ needs.detect-changes.outputs.ventas }}"
          echo "=========================================="